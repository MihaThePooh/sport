<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренировки</title>
<meta name="theme-color" content="#f7f6f4">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<style>
:root {
  --bg: #f7f6f4;
  --card: #ffffff;
  --fg: #1a1714;
  --muted: #8b837a;
  --line: #e3ded7;
  --accent: #2f6f4e;
  /* Высота одного деления барабана: и шаг прокрутки, и расстояние
     между соседними датами. Отсюда её берут и вёрстка, и скрипт —
     раньше число стояло в двух местах и однажды разъехалось. */
  --step: 38px;
  /* Видимая высота барабана. Меньше трёх делений — соседние даты
     обрезаны по краям и не оставляют вокруг пустых полей. */
  --view: 92px;
  /* Полоса-прицел чуть выше деления: выбранная дата так читается
     крупнее соседних, не растаскивая при этом сам барабан. */
  --aim: 44px;
  --gold: #b8860b;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0 0 calc(24px + env(safe-area-inset-bottom));
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-text-size-adjust: 100%;
}
@media (min-width: 720px) { body { max-width: 560px; margin: 0 auto; } }

/* Шапка — ровно такая же, как в тудушке: те же размеры, тот же шрифт,
   та же полоска снизу. Приложения соседние, и переключаться между ними
   должно быть как между экранами одного, а не двух разных. */
header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(5px + env(safe-area-inset-top)) 14px 5px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
h1 {
  margin: 0;
  font-size: 16px;
  font-weight: 400;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
}

/* Бургер той же формы, что кнопки в заголовках разделов тудушки. */
#burger {
  width: 24px;
  height: 24px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.6px solid #c3bcb2;
  border-radius: 5px;
  background: none;
  color: var(--muted);
  padding: 0;
  cursor: pointer;
}
#burger svg { width: 13px; height: 13px; display: block; }
#burger:active { transform: scale(.92); }

#state {
  margin-left: auto;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
#state.err { color: #b03030; font-weight: 600; }

/* Меню — выезжающий лист, как в тудушке. */
#menu[hidden] { display: none; }
#menu {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(26,23,20,.28);
}
#menu .sheet {
  position: absolute; left: 8px; right: 8px;
  top: calc(50px + env(safe-area-inset-top));
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 6px;
  box-shadow: 0 10px 30px rgba(0,0,0,.14);
}
#menu button {
  display: block; width: 100%;
  border: 0; border-radius: 8px;
  background: none; color: var(--fg);
  font: inherit; font-size: 15px; text-align: left;
  padding: 13px 12px; min-height: 46px;
  cursor: pointer;
}
#menu button:active { background: #f2efea; }
@media (min-width: 720px) {
  #menu .sheet { left: calc(50% - 272px); right: auto; width: 300px; }
}

/* Рекорды в листе меню. Раньше они занимали строку под каждой
   карточкой формы, а смотрят на них раз в неделю. */
#recsbody[hidden] { display: none; }
#recsbody { padding: 2px 14px 12px; }
#recsbody .rec { margin: 0 0 12px; }
#recsbody .rec:last-child { margin-bottom: 0; }

/* Режим правки. Полоса поверх формы: без неё «Записать» в режиме
   правки и «Записать» новую тренировку выглядят одинаково, и однажды
   ты перезапишешь не тот день. */
#edit[hidden] { display: none; }
#edit {
  margin: 10px 16px 0; padding: 10px 12px;
  background: #fdf6e6; border: 1.5px solid var(--gold); border-radius: 12px;
  display: flex; align-items: center; gap: 10px;
}
#edit.увело { background: #fdeaea; border-color: #b03030; }
#edit .txt { flex: 1 1 auto; font-size: 14px; line-height: 1.35; }
#edit .txt b { display: block; font-size: 15px; }
#edit button {
  flex: 0 0 auto; height: 38px; padding: 0 14px;
  border: 0; border-radius: 9px; background: #e7e2da;
  font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
}
#editdel { color: #b03030; }
/* Кнопка ждёт второго нажатия — цвет меняется вместе с надписью,
   иначе «точно удалить?» читается как вопрос, а не как кнопка. */
#editdel.sure { background: #b03030; color: #fff; }
/* Правится одна карточка — её и подсвечиваем, остальные приглушаем,
   чтобы не заполнить по привычке соседнюю. */
.move.правится { border-color: var(--gold); box-shadow: 0 0 0 2px #f6e7c0; }
.move.чужая { opacity: .45; }

/* Разбор методов тренировки: раскрывается там же, в листе меню.

   Почему внутри приложения, а не ссылкой на статью: читать про метод
   приходится ровно в тот момент, когда стоишь у турника и не помнишь,
   сколько отдыхать между кругами. Ссылка в такой момент — это выход
   из приложения, поиск вкладки и потерянная мысль. */
#learnbody[hidden] { display: none; }
#learnbody {
  padding: 2px 12px 10px; max-height: 62vh; overflow: auto;
  font-size: 14px; line-height: 1.5;
}
#learnbody h3 {
  margin: 12px 0 6px; font-size: 15px; font-weight: 600;
}
#learnbody h3:first-child { margin-top: 4px; }
#learnbody p { margin: 0 0 8px; }
#learnbody ul { margin: 0 0 8px; padding-left: 18px; }
#learnbody li { margin: 0 0 4px; }
#learnbody b { font-weight: 600; }
#learnbody .plan {
  background: #f2efea; border-radius: 8px;
  padding: 8px 10px; margin: 0 0 8px;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12.5px; line-height: 1.5; white-space: pre-wrap;
}
#learnbody .note { color: var(--muted); font-size: 13px; }

/* Перенос на другое устройство: раскрывается прямо в листе меню. */
#mvbody[hidden] { display: none; }
#mvbody { padding: 2px 12px 10px; }
#mvbody p { margin: 0 0 8px; font-size: 14px; line-height: 1.4; }
#mvbody p.warn { color: #b03030; }
#mvbody .link {
  /* Ссылка длинная и её будут перепечатывать глазами: моноширинный
     шрифт, перенос по любому символу и крупная область для выделения. */
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px; line-height: 1.45;
  word-break: break-all; user-select: all;
  background: #f2efea; border-radius: 8px;
  padding: 8px 10px; margin-bottom: 8px;
}
#mvbody .acts { display: flex; gap: 8px; }
#mvbody .acts button {
  width: auto; flex: 1 1 auto;
  min-height: 44px; padding: 0 14px;
  text-align: center; font-size: 15px;
  border-radius: 9px; background: var(--accent); color: #fff;
}
#mvbody .acts button.plain { background: #e7e2da; color: var(--fg); }

/* Дата вводится отдельно от упражнений: заносить занятия задним числом
   Михаил будет чаще, чем в тот же день — данные приезжают из телеграма.

   Барабаны, а не календарь. Календарь требует прицелиться в клетку
   4×4 мм; барабан достаточно крутануть в сторону. Физику инерции не
   пишем руками — это делает сам браузер: обычная прокрутка плюс
   scroll-snap. Отсюда и «долгий» ход от одного свайпа.

   Барабаны к левому краю, подтверждение — к правому. Между ними пусто:
   два разных действия, и путать их пальцем не надо. */
.pick {
  display: flex; align-items: center;
  justify-content: space-between;
  /* Поля те же 16 px, что у карточек, панели таймера и таблицы:
     блоки идут друг под другом, и разнобой в отступах читается как
     перекос, даже когда разница всего три пикселя. */
  padding: 2px 16px 0;
}

/* Ни подложки, ни рамки: барабаны лежат прямо на фоне страницы.
   Единственное, что их выделяет, — зелёная полоса-прицел. */
.wheels {
  position: relative;
  display: flex; gap: 2px;
}
/* Полоса-прицел по центру: видно, какое значение выбрано. Она чуть
   выше деления, поэтому выбранная дата читается крупнее соседних. */
.wheels::before {
  content: ''; position: absolute; left: 0; right: 0;
  top: 50%; height: var(--aim); margin-top: calc(var(--aim) / -2);
  background: rgba(47,111,78,.07);
  border-top: 1px solid rgba(47,111,78,.25);
  border-bottom: 1px solid rgba(47,111,78,.25);
  border-radius: 8px; pointer-events: none;
}
.wheel {
  height: var(--view);
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  scrollbar-width: none;
  -ms-overflow-style: none;
  -webkit-overflow-scrolling: touch;
  text-align: center;
  /* Края растворяются — оттого и читается как барабан, а не как список.
     Соседние даты приглушены, но читаются: полностью прятать их нельзя —
     тогда непонятно, в какую сторону крутить. */
  -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,.5) 14%, #000 34%, #000 66%, rgba(0,0,0,.5) 86%, rgba(0,0,0,.18) 100%);
  mask-image: linear-gradient(180deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,.5) 14%, #000 34%, #000 66%, rgba(0,0,0,.5) 86%, rgba(0,0,0,.18) 100%);
}
.wheel::-webkit-scrollbar { display: none; }
.wheel ul {
  list-style: none; margin: 0;
  /* Ровно половина разницы между окном и делением. Иначе выбранное
     значение перестанет совпадать с прицелом: скрипт ставит
     scrollTop = idx * STEP и рассчитывает именно на это. */
  padding: calc((var(--view) - var(--step)) / 2) 0;
}
.wheel li {
  height: var(--step); line-height: var(--step);
  scroll-snap-align: center;
  font-size: 16px; color: #b3aca2;
  /* Масштабировать соседние деления нельзя: transform меняет и то, что
     возвращает getBoundingClientRect, и геометрию scroll-snap. Разницу
     держим кеглем и растворением по краям — и меняем кегль без
     перехода: на быстрой прокрутке анимация роста читается как рывок. */
  transition: color .12s ease;
  cursor: pointer;
}
.wheel li.on {
  color: var(--fg); font-weight: 600; font-size: 21px;
}
.wheel.day { width: 44px; }
.wheel.mon { width: 52px; }
/* Год показан двумя цифрами с апострофом — ’26. Четыре цифры съедали
   20 px, а место понадобилось кнопке таймера. Апостроф именно ’
   (U+2019), а не обратная кавычка: типографски это сокращение года,
   как в «’90-е». */
.wheel.year { width: 46px; }

/* Подтверждение даты. Тусклая — значит показанное уже записано.
   Размер в высоту равен прицелу на барабане: две части одного действия
   должны выглядеть как пара, а не как кнопка и что-то рядом. */
/* Кнопка подтверждения даты. Словами, а не галочкой: барабаны
   крутятся сами от неосторожного движения, и человек должен видеть,
   что дату надо именно установить, а не просто выбрать. */
/* Надпись в две строки. Одной строкой кнопка требовала 166 px, а после
   появления таймера на неё осталось 128 — текст уезжал за правый край
   экрана. Перенос сохраняет слова и высоту нажатия, теряя только
   ширину, которой всё равно нет. */
.fix {
  flex: 0 1 auto; min-height: var(--aim); padding: 5px 11px;
  border: 0; border-radius: 12px;
  background: var(--accent); color: #fff;
  font: inherit; font-size: 14.5px; font-weight: 600; line-height: 1.15;
  white-space: normal; text-align: center;
  cursor: pointer;
  transition: background .15s ease, opacity .15s ease;
}
/* Установлена — кнопка гаснет до серо-зелёной: дело сделано, звать
   к себе ей больше незачем. */
.fix.done { background: #8fb3a0; color: #fff; font-size: 13.5px; }

/* Кнопка таймера стоит между барабанами и «установить дату» — в месте,
   освободившемся от четырёхзначного года. 44 px в обе стороны: это
   минимум, в который палец попадает не глядя. */
.tbtn {
  flex: 0 0 auto;
  width: 44px; height: 44px; margin-left: 6px;   /* справа ноль: край кнопки = общая линия 16 px */
  display: flex; align-items: center; justify-content: center;
  border: 1.5px solid var(--line); border-radius: 12px;
  background: var(--card); color: var(--muted);
  cursor: pointer; padding: 0;
  transition: border-color .15s ease, color .15s ease, background .15s ease;
}
.tbtn svg { width: 23px; height: 23px; display: block; }
/* Открыт — кнопка в цвете приложения: видно, что панель ниже её, а не
   сама по себе. */
.tbtn.on { border-color: var(--accent); color: var(--accent); background: #eef3ef; }
/* Отсчёт идёт, а панель свернули — кнопка остаётся золотой, иначе о
   работающем таймере узнаёшь только по писку. */
.tbtn.идёт { border-color: var(--gold); color: var(--gold); background: #fdf7e8; }

/* Панель таймера выезжает под блоком даты. max-height, а не hidden:
   атрибут hidden выключает элемент целиком, и анимировать нечего. */
#timer {
  overflow: hidden;
  max-height: 0; opacity: 0;
  margin: 0 16px;
  transition: max-height .26s ease, opacity .2s ease, margin-top .26s ease;
}
/* Потолок с запасом на вторую строку: на узком экране кнопки
   переносятся под табло, и прежних 96 px им уже не хватало — низ
   ряда просто срезался. max-height только ограничивает, поэтому на
   широком экране лишняя высота ничего не портит. */
#timer.on { max-height: 140px; opacity: 1; margin-top: 8px; }
/* С раскрытой настройкой панель выше: max-height анимируется,
   поэтому её значение приходится задавать числом. */
#timer.on.свой { max-height: 360px; }
/* wrap обязателен: кнопок в ряду стало три, и на 360 px они впритык.
   Без переноса ряд не «ломается» — он молча вылезает за скруглённую
   рамку, панель получает горизонтальную прокрутку, и край уезжает. */
#timer .row {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 8px;
  background: var(--card);
  border: 1px solid var(--line); border-radius: 12px;
  padding: 8px 10px;
}
/* Табло. tabular-nums — цифры одной ширины, иначе шесть цифр дёргают
   табло на каждой сотой, и смотреть на это невозможно. */
.face {
  font-size: 29px; font-weight: 600; letter-spacing: .5px;
  font-variant-numeric: tabular-nums;
  color: var(--fg); cursor: pointer;
  padding: 2px 4px; border-radius: 8px;
  transition: color .15s ease, background .15s ease;
}
.face.идёт { color: var(--accent); }
.face.вышло { color: #fff; background: var(--accent); }
/* Кнопки готовых интервалов — к правому краю, как просил Михаил:
   палец идёт к ним от кнопки даты, которая стоит там же. */
.tacts { display: flex; gap: 6px; flex: 1 1 auto; justify-content: flex-end; }
.tacts button {
  min-width: 56px; height: 44px; padding: 0 7px;
  border: 0; border-radius: 11px;
  background: var(--accent); color: #fff;
  font: inherit; font-size: 15px; font-weight: 600;
  cursor: pointer;
}
.tacts button:active { background: #27593f; }
/* Кнопка своего интервала — слева от готовых, рамкой, а не заливкой:
   она не запускает отсчёт, а открывает настройку. */
.tacts .own {
  min-width: 44px; padding: 0 8px;
  background: none; color: var(--accent);
  border: 1.5px solid var(--line);
}
.tacts .own:active { background: #eef3ef; }
.tacts .own.on { border-color: var(--accent); background: #eef3ef; }
.tacts .own svg { width: 19px; height: 19px; display: block; margin: 0 auto; }

/* Настройка своего интервала. Кнопками, а не полем ввода: между
   подходами руки дрожат, телефон лежит на полу, и цифровая
   клавиатура тут проигрывает крупным кнопкам вчистую. */
#tset[hidden] { display: none; }
#tset {
  margin-top: 8px; padding-top: 8px;
  border-top: 1px dashed var(--line);
}
#tset .line {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 6px;
}
#tset .line b {
  flex: 0 0 34px;
  font-size: 13px; font-weight: 400; color: var(--muted);
}
#tset .line .val {
  flex: 1 1 auto; text-align: center;
  font-size: 22px; font-weight: 600;
  font-variant-numeric: tabular-nums;
}
#tset .line button {
  width: 44px; height: 40px; flex: 0 0 auto;
  border: 1.5px solid var(--line); border-radius: 10px;
  background: var(--card); color: var(--fg);
  font: inherit; font-size: 21px; line-height: 1; cursor: pointer;
}
#tset .line button:active { background: #f2efea; }
#tset .go {
  width: 100%; height: 44px;
  border: 0; border-radius: 11px;
  background: var(--accent); color: #fff;
  font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
}

/* Все три движения на одной странице, друг под другом.

   Раньше форма была декой из двух страниц — обычная тренировка и
   мио-серия, между ними свайп. Деку убрали: формат больше не выбирают
   заранее. Мио-серия — это просто занятие, записанное в несколько
   заходов кнопкой «серия», и отдельная страница под него не нужна. */
#moves { padding: 0 16px; }

.move {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin: 10px 0;
  padding: 14px;
}
.move .why {
  margin: 8px 0 0; font-size: 12.5px; line-height: 1.4; color: var(--muted);
}
/* Название и набранное — одной строкой: «подтягивания : 9 + 3».
   Сумма прямо в заголовке заменяет собой подпись на кнопке и видна,
   даже когда до кнопок надо тянуться глазом вниз. */
.top {
  display: flex; align-items: baseline; gap: 6px; margin-bottom: 12px;
  /* Межстрочный интервал добавлял сверху лишние ~4 px, и отступ над
     названием выходил заметно больше бокового. Прижимаем строку. */
  line-height: 1.15;
}
.move h2 {
  margin: 0; font-size: 17px; font-weight: 600;
}
/* Набранное в этой серии. Пустое — значит полей ещё не трогали, и
   двоеточие тоже прячем: «подтягивания :» без продолжения читается
   как оборванная строка. */
.tally { font-size: 17px; font-weight: 600; color: var(--fg); }
.tally:empty { display: none; }

/* Полоска серий — только у мио-тренировки на правке. В полях всегда
   одна серия, кнопки переключают какая. */
.stabs { display: flex; gap: 8px; margin: 2px 0 10px; }
.stab {
  flex: 1 1 0; min-height: 40px; padding: 0 8px;
  border: 1.5px solid var(--line); border-radius: 10px;
  background: var(--card); color: var(--muted);
  font: inherit; font-size: 14px; font-weight: 600;
  cursor: pointer;
  transition: border-color .15s ease, color .15s ease, background .15s ease;
}
.stab.on { border-color: var(--gold); color: var(--gold); background: #fdf7e8; }


.sets { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
/* Поле на подход, а не одна строка «9 7 5»: на телефоне так вылезает
   цифровая клавиатура, а не полная, и разделители не нужны вовсе. */
.sets input {
  /* 44 px — нижняя граница удобного попадания пальцем, ниже не идём.
     Лишний воздух убран по бокам: под две цифры 62 px было много. */
  width: 48px; height: 44px;
  font: inherit; font-size: 19px; text-align: center;
  border: 1.5px solid var(--line); border-radius: 9px;
  background: #fcfbfa; color: var(--fg);
  -moz-appearance: textfield;
}
.sets input::-webkit-outer-spin-button,
.sets input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.sets input:focus { outline: none; border-color: var(--accent); background: #fff; }
/* Место под следующий подход. Не кнопка и не поле: нажимать её не
   надо, она только показывает, что ряд продолжится. Кнопка «+» тут
   была лишним жестом — ввёл число, и место под следующее появляется
   само. */
.sets .ghost {
  width: 48px; height: 44px; flex: 0 0 auto;
  border: 1.5px dashed #d8d2ca; border-radius: 9px;
  background: none;
  /* Насквозь для пальца: случайный тап по ней не должен ни
     фокусироваться, ни сворачивать клавиатуру. */
  pointer-events: none;
}
.sets .ghost[hidden] { display: none; }

/* Три кнопки в ряд, равной ширины. Порядок не случайный: слева
   «комментарий» — его жмут редко и не в спешке, справа «тренировка» —
   ею занятие закрывают. «Серия» посередине, её нажимают чаще всего,
   и с обеих сторон у неё соседи, а не край экрана. */
.act {
  display: flex; gap: 8px; margin-top: 12px;
}
.act button {
  flex: 1 1 0; min-width: 0;
  height: 52px; padding: 0 6px; border-radius: 10px;
  font: inherit; font-size: 13.5px; font-weight: 600; line-height: 1.2;
  cursor: pointer;
  /* Переносим, а не обрезаем: «записать се…» и «записать тр…» на
     соседних кнопках различаются двумя буквами, и в спешке между
     подходами их не отличить. */
  white-space: normal;
}
.note-btn {
  border: 1.5px solid var(--line);
  background: none; color: var(--fg);
}
.note-btn.has { border-color: var(--accent); color: var(--accent); }

.go {
  border: 0;
  background: var(--accent); color: #fff;
}
/* «Записать серию» — заливка светлее основной: действие частое, но
   промежуточное, занятие им не закрывается. */
.go.ser { background: #8fb3a0; }
.go:disabled { background: #cfd8d2; cursor: default; }
/* Подтверждение на месте самой кнопки: всплывашку внизу экрана между
   подходами не замечаешь, а здесь палец уже смотрит. */
.go.ok { background: var(--gold); color: #3a3126; }

/* Поле комментария разворачивается под кнопками. Открыто — значит
   человек уже в него метит, поэтому сразу с фокусом.

   Селекторы намеренно прибиты к карточке. Без «.move» правило
   ловило и ячейку комментария в таблице: та получала display: flex,
   выпадала из табличной раскладки и висела на 10 px ниже своей
   строки, не растягиваясь на её высоту. */
.move .note {
  margin-top: 10px; display: flex; gap: 8px;
}
.move .note textarea {
  flex: 1 1 auto; min-width: 0; height: 66px; resize: none;
  font: inherit; font-size: 15px; padding: 8px 10px;
  border: 1.5px solid var(--accent); border-radius: 9px;
  background: #fff; color: var(--fg);
}
.move .note textarea:focus { outline: none; }
.move .note button {
  flex: 0 0 auto; width: 64px; height: 66px; border-radius: 9px;
  border: 0; background: var(--accent); color: #fff;
  font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
}

/* Таблица последних тренировок — та же, что в книге. Внизу страницы,
   чтобы после записи было видно результат, не открывая меню. */
.log { margin: 22px 16px 0; }
.log h3 {
  margin: 0 0 8px; font-size: 15px; font-weight: 600; color: var(--muted);
}
/* На телефоне таблица шире экрана — прокручивается вбок. Колонка с
   датой при этом остаётся на месте, иначе непонятно, чья строка. */
.log .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
/* Ширина по содержимому, но не уже экрана: на телефоне таблица
   прокручивается вбок, на широком — занимает всё и не растягивает
   колонки пустотой. */
.log table {
  border-collapse: collapse; font-size: 12.5px;
  width: max-content; min-width: 100%;
}
.log th, .log td {
  border: 1px solid var(--line); padding: 4px 6px; text-align: center;
  white-space: nowrap;
}
.log thead th {
  background: var(--accent); color: #fff; font-weight: 600;
  position: sticky; top: 0;
}
.log td.d, .log th.d {
  position: sticky; left: 0; z-index: 1;
  background: var(--card); text-align: left;
}
.log thead th.d { background: var(--accent); z-index: 2; }
/* Полосы через строку. Фон нужен КАЖДОЙ ячейке: без него прозрачные
   ячейки показывают фон страницы, и чередование было видно только на
   колонке даты — ей фон задан ради sticky. */
.log tbody td { background: var(--card); }
.log tbody tr:nth-child(even) td { background: #f7f6f4; }
.log tbody tr { cursor: pointer; }
.log tbody tr:hover td { background: #eef3ef; }
.log td.sum { font-weight: 600; }
/* Комментарий — единственная колонка с текстом, и переносить его по
   слогам в 140 px нельзя: строки становились втрое выше соседних.
   Даём ширину под фразу целиком и переносим только по словам. */
.log td.cmt {
  text-align: left; white-space: normal; word-break: normal;
  min-width: 260px; max-width: 420px; line-height: 1.35;
}

/* Рекорды уехали в меню: в форме они занимали строку под каждой
   карточкой, а смотрят на них раз в неделю. */
.rec { font-size: 14px; line-height: 1.7; }
.rec b { color: var(--gold); font-weight: 600; }
.rec .dim { color: #b3aca3; }   /* абсолютный пик — справочно, мельче по весу */

/* Всплывающая строка ответа — та же роль, что у «сохранено» в тудушке. */
#say {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
  background: #1a1714; color: #fff;
  font-size: 14px; padding: 9px 16px; border-radius: 20px;
  opacity: 0; pointer-events: none; transition: opacity .2s ease;
  max-width: 90vw; text-align: center;
}
#say.on { opacity: .94; }
#say.win { background: var(--accent); }
#say.bad { background: #c0392b; }

footer { padding: 6px 16px 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <button id="burger" aria-label="меню">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <h1>Тренировки</h1>
  <span id="state">…</span>
</header>

<div id="menu" hidden>
  <div class="sheet">
    <button id="recs" type="button">Рекорды</button>
    <div id="recsbody" hidden></div>
    <button id="learn" type="button">Как тренироваться</button>
    <div id="learnbody" hidden></div>
    <button id="dl" type="button">Скачать таблицу .xlsx</button>
    <button id="mv" type="button">Перенести на другое устройство</button>
    <div id="mvbody" hidden></div>
  </div>
</div>

<div class="pick">
  <div class="wheels" id="wheels"></div>
  <button class="fix" id="fix" type="button"
          aria-label="подтвердить дату">установить дату</button>
  <!-- Таймер у самого края: к нему тянутся между подходами, когда
       дата давно установлена, и краю экрана палец находит вслепую. -->
  <button class="tbtn" id="tbtn" type="button"
          aria-label="таймер отдыха" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="13.5" r="7.5"></circle>
      <path d="M12 10v3.5l2.5 2"></path>
      <path d="M9.5 3h5"></path>
      <path d="M18.5 6.5l1.5-1.5"></path>
    </svg>
  </button>
</div>

<!-- Таймер отдыха между подходами. Свёрнут, пока не нажали кнопку. -->
<div id="timer">
  <div class="row">
    <div class="face" id="tface" role="timer"
         title="тап — сбросить">00:00:00</div>
    <div class="tacts">
      <button type="button" class="own" id="townbtn"
              aria-label="свой интервал" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/>
          <circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>
        </svg>
      </button>
      <button type="button" data-sec="20">20 сек</button>
      <button type="button" data-sec="180">3 мин</button>
    </div>
  </div>
  <div id="tset" hidden>
    <div class="line">
      <b>мин</b>
      <button type="button" data-step="-60">−</button>
      <span class="val" id="tmin">2</span>
      <button type="button" data-step="60">+</button>
    </div>
    <div class="line">
      <b>сек</b>
      <button type="button" data-step="-5">−</button>
      <span class="val" id="tsec">30</span>
      <button type="button" data-step="5">+</button>
    </div>
    <button type="button" class="go" id="tsetgo">Запустить 2:30</button>
  </div>
</div>

<div id="edit" hidden>
  <div class="txt"></div>
  <button type="button" id="editdel">Удалить</button>
  <button type="button" id="editoff">Отмена</button>
</div>

<div id="moves"></div>

<section class="log">
  <h3>Последние 15 тренировок</h3>
  <div class="scroll"><table id="logtable"></table></div>
</section>

<footer>Тап по строке — поправить запись. Таблица та же,
что в <code>.xlsx</code></footer>
<div id="say"></div>

<script>
(function () {
  'use strict';

  var MOVES = ['подтягивания', 'отжимания', 'приседания'];
  var MAX_SETS = 12;  // столько же стоит в server.py — там же и отказ, если обойти

  /* Форматы занятия. Пустая строка — обычная тренировка: так же она
     лежит и в CSV, и старые записи читаются без единой правки.

     Мио-серия: первый подход почти до отказа, дальше короткие круги
     по 3-5 повторений через 20-30 секунд. Смысл — в утомлении: на
     свежую мышцу тяжёлые волокна не включаются, а после первого
     подхода организму больше нечем работать, и он включает их
     с первого же повтора круга.

     Формат больше не выбирают заранее: его ставит кнопка «серия». */
  var NORMAL = '';
  var MYO = 'мио';
  var SEP = '\\';     // делит серии в ячейке — тот же знак, что в книге
  var OK_MS = 3000;   // столько держится «серия записана» на месте кнопки

  /* --- ключ доступа ------------------------------------------------------
     Ни логина, ни пароля: дневник открывается ключом на 256 бит. Пришёл
     по ссылке с ключом — забираем его и чистим адресную строку, чтобы
     ключ не остался в истории браузера и в заголовке вкладки. Пришёл
     без ключа — заводим свой: это новый человек и новый пустой дневник.

     Ключ живёт в памяти браузера и привязан к имени сайта. Перенести
     дневник на другой адрес — значит один раз открыть его со ссылкой. */
  var ACCESS = 'спорт.ключ';
  var m = location.hash.match(/k=([a-f0-9]{64})/i);
  if (m) {
    try { localStorage.setItem(ACCESS, m[1].toLowerCase()); } catch (e) { /* приват */ }
    history.replaceState(null, '', location.pathname);
  }
  /* Ссылку могут открыть во вкладке, где дневник уже открыт. Тогда
     меняется только часть после решётки, а это для браузера не переход:
     страница не перезагружается, и весь разбор выше не отработает —
     человек смотрит на свой прежний дневник и думает, что перенос не
     сработал. Ловим смену решётки отдельно и перезагружаемся сами. */
  window.addEventListener('hashchange', function () {
    var got = location.hash.match(/k=([a-f0-9]{64})/i);
    if (!got) { return; }
    try { localStorage.setItem(ACCESS, got[1].toLowerCase()); } catch (e) { /* приват */ }
    location.replace(location.pathname);
  });

  var access = null;
  try { access = localStorage.getItem(ACCESS); } catch (e) { access = null; }
  if (!access) {
    var buf = new Uint8Array(32);
    window.crypto.getRandomValues(buf);
    access = Array.prototype.map.call(buf, function (b) {
      return ('0' + b.toString(16)).slice(-2);
    }).join('');
    try { localStorage.setItem(ACCESS, access); } catch (e) { /* приват — до перезагрузки */ }
  }

  /* Заголовки для запроса. Отдельной функцией, чтобы ключ подставлялся
     в одном месте: забыть его в новом запросе — значит получить 401. */
  function auth(extra) {
    var h = { 'Authorization': 'Bearer ' + access };
    if (extra) {
      for (var k in extra) { if (extra.hasOwnProperty(k)) { h[k] = extra[k]; } }
    }
    return h;
  }
  var box = document.getElementById('moves');

  function eachCard(fn) {
    [].forEach.call(box.querySelectorAll('.move'), fn);
  }

  function cardOf(move) {
    return box.querySelector('[data-move="' + move + '"]');
  }
  var sayEl = document.getElementById('say');
  var stateEl = document.getElementById('state');
  var sayTimer = null;

  /* Две разные вещи, и путать их не надо.
     state — строка в углу, как в тудушке: что сейчас с сервером.
     say — всплывашка, и только по хорошему поводу: рекорд. */
  function stat(text, bad) {
    stateEl.textContent = text;
    stateEl.classList.toggle('err', !!bad);
  }

  function say(text, kind) {
    sayEl.textContent = text;
    sayEl.className = 'on' + (kind ? ' ' + kind : '');
    clearTimeout(sayTimer);
    sayTimer = setTimeout(function () { sayEl.className = ''; }, 2600);
  }

  /* --- меню --- */
  var menu = document.getElementById('menu');
  document.getElementById('burger').onclick = function () { menu.hidden = false; };
  // Закрывая меню, сворачиваем и раскрытый перенос: иначе в следующий
  // раз ссылка окажется на экране сразу, без спроса.
  function closeMenu() {
    menu.hidden = true;
    if (mvBody) { mvBody.hidden = true; }
    var rb = document.getElementById('recsbody');
    if (rb) { rb.hidden = true; }
  }
  menu.onclick = function (e) {
    // Клик мимо листа закрывает — отдельный крестик не нужен.
    if (e.target === menu) { closeMenu(); }
  };
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeMenu(); }
  });
  /* --- журнал --------------------------------------------------------

     Списка записей в меню больше нет: его заменила таблица последних
     тренировок внизу страницы. Правка начинается тапом по её строке,
     удаление живёт в панели правки — там, где видно, что именно
     сейчас под рукой. */

  function ддмм(iso) {
    var ч = iso.split('-');
    return ч[2] + '.' + ч[1] + (ч[0] === String(new Date().getFullYear())
      ? '' : '.' + ч[0]);
  }

  /* Перечитать состояние и перерисовать форму с таблицей. Нужно после
     любой правки: таблица внизу должна показывать то же, что лежит на
     сервере, иначе следующий тап поднимет в форму устаревшую строку. */
  function refresh() {
    return fetch('/api/state', { headers: auth() })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        remember(d);
        paint(d);
        рекорды(d);
        eachCard(check);
        return d;
      });
  }

  function удалить(r) {
    return fetch('/api/del', {
      method: 'POST',
      headers: auth({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ 'дата': r['дата'], 'упражнение': r['упражнение'] })
    }).then(function (о) {
      return о.json().then(function (d) {
        if (!о.ok) { throw new Error(d['ошибка'] || 'код ' + о.status); }
        return d;
      });
    }).then(function () {
      say('удалено: ' + r['упражнение'] + ' за ' + ддмм(r['дата']));
      // Правили именно её — режим правки уже не о чем.
      if (правка && правка['дата'] === r['дата'] &&
          правка['движения'][r['упражнение']]) { бросить(); }
      return refresh();
    }).catch(function (e) {
      say('не удалил: ' + e.message, 'bad');
    });
  }

  /* --- режим правки --- */
  var editBar = document.getElementById('edit');
  var правка = null;         // запись, которую сейчас правим

  document.getElementById('editoff').onclick = function () { бросить(); };

  /* Удаление живёт здесь, а не в таблице: строка таблицы — это день,
     а удаляется занятие, то есть день плюс движение. Пока запись
     поднята в форму, видно ровно то, что исчезнет.

     Спрашиваем подтверждение сменой надписи, а не confirm(): системное
     окно в PWA выглядит чужим, а на iOS может не показаться вовсе. */
  var delBtn = document.getElementById('editdel');
  var ждуПодтверждения = false;

  delBtn.onclick = function () {
    if (!правка) { return; }
    if (!ждуПодтверждения) {
      ждуПодтверждения = true;
      delBtn.textContent = 'точно удалить?';
      delBtn.classList.add('sure');
      setTimeout(function () {
        if (ждуПодтверждения) { сброситьУдаление(); }
      }, 4000);
      return;
    }
    var r = правка;
    сброситьУдаление();
    удалить(r);
  };

  function сброситьУдаление() {
    ждуПодтверждения = false;
    delBtn.textContent = 'Удалить';
    delBtn.classList.remove('sure');
  }

  function править(r) {
    var мои = Object.keys(r['движения']);
    if (!мои.length) { return; }

    // Дата: ставим барабаны и сразу считаем подтверждённой — человек её
    // не выбирал заново, он открыл существующую запись.
    var ч = r['дата'].split('-');
    wYear.set(Number(ч[0]));
    wMon.set(Number(ч[1]));
    refill();
    wDay.set(Number(ч[2]));
    fixed = r['дата'];
    try { localStorage.setItem(KEY, fixed); } catch (e) { /* приватный режим */ }
    relight();

    правка = r;
    editBar.querySelector('.txt').innerHTML =
      '<b>Правка тренировки</b>' + мои.join(', ') + ' за ' + ддмм(r['дата']);
    editBar.hidden = false;

    eachCard(function (c) {
      var было = r['движения'][c.dataset.move];
      // Движения, которых в этот день не было, гасим: записать их можно
      // и так, но править нечего.
      c.classList.toggle('правится', !!было);
      c.classList.toggle('чужая', !было);
      if (было) { сериюВКарточку(c, было); }
      check(c);

  /* Мио-тренировка правится по одной серии за раз.

     Высыпать все серии в поля подряд нельзя: «9 3 3 3 3 3 5 2 2 2 2»
     одиннадцатью ячейками не читается, а при сохранении склеивается
     в одну серию — границы между заходами теряются навсегда. Поэтому
     над полями встаёт полоска кнопок, и в полях всегда ровно одна
     серия. Серии целиком живут на самой карточке, а в файл уходят
     все разом, когда нажата «сохранить правку». */
  function сериюВКарточку(card, серии) {
    var старые = card.querySelector('.stabs');
    if (старые) { старые.remove(); }
    card.серии = серии.map(function (s) { return s.slice(); });
    card.активная = 0;

    // Одна серия — обычная тренировка, полоска ей не нужна.
    if (card.серии.length > 1) {
      var box = el('div', 'stabs');
      card.серии.forEach(function (s, i) {
        var b = el('button', 'stab' + (i ? '' : ' on'), (i + 1) + '-я серия');
        b.type = 'button';
        b.onclick = function () { выбратьСерию(card, i); };
        box.appendChild(b);
      });
      card.insertBefore(box, card.querySelector('.sets'));
    }
    заполнить(card, card.серии[0] || []);
  }

  function выбратьСерию(card, i) {
    if (!card.серии || card.активная === i) { return; }
    // Уходя с серии, забираем из полей то, что человек успел исправить.
    card.серии[card.активная] = values(card);
    card.активная = i;
    [].forEach.call(card.querySelectorAll('.stab'), function (b, n) {
      b.classList.toggle('on', n === i);
    });
    заполнить(card, card.серии[i]);
    check(card);
  }

  /* Серии карточки с учётом того, что сейчас набрано в полях.
     Пустые выбрасываем: серия, из которой стёрли все числа, — это
     отказ от неё, а не серия без подходов. */
  function серииКарточки(card) {
    if (!card.серии || card.серии.length < 2) { return null; }
    var все = card.серии.map(function (s, i) {
      return i === card.активная ? values(card) : s;
    });
    все = все.filter(function (s) { return s.length; });
    return все.length ? все : null;
  }

  function забытьСерии(card) {
    var box = card.querySelector('.stabs');

     подходов. Пустое место под следующий добавит подогнать(). */
  function заполнить(card, числа) {
    var sets = card.querySelector('.sets');
    var g = sets.querySelector('.ghost');
    [].forEach.call(sets.querySelectorAll('input'), function (i) { i.remove(); });
    for (var i = 0; i < числа.length; i++) {

    function old() {

      // всех браузерах. Временное поле, выделение, копирование, уборка.
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.remove();
      done(ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, old);

  /* --- дата барабанами ---

     Барабан — это обычный прокручиваемый список с scroll-snap. Инерцию
     и «долгий ход» от одного свайпа даёт сам браузер, писать физику
     руками не надо и не стоит: своя всегда ощущается чужой.

     Выбранное значение — то, что оказалось в центре: индекс считается
     как scrollTop / высоту деления. Событие scrollend поддержано не
     везде, поэтому досчитываем по таймеру после последнего движения. */

  // Шаг берём из CSS, а не дублируем числом: высоту деления меняют
  // в вёрстке, и скрипт обязан узнать об этом сам.
  var STEP = parseFloat(getComputedStyle(document.documentElement)
                          .getPropertyValue('--step')) || 49;
  var MONTHS = ['янв', 'фев', 'мар', 'апр', 'май', 'июн',
                'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  var KEY = 'спорт-дата';        // где помним последнюю подтверждённую дату

  function wheel(cls, onpick) {
    var w = el('div', 'wheel ' + cls);
    var ul = el('ul');
    w.appendChild(ul);
    var items = [];
    var idx = 0;
    var timer = null;
    var quiet = false;           // пока ставим позицию кодом, событий не слушаем

    function light() {
      for (var i = 0; i < items.length; i++) {
        items[i].classList.toggle('on', i === idx);
      }
    }

    function settle() {
      var i = Math.round(w.scrollTop / STEP);
      i = Math.max(0, Math.min(i, items.length - 1));
      if (i === idx) { light(); return; }
      idx = i;
      light();
      if (onpick) { onpick(); }
    }

    w.addEventListener('scroll', function () {
      if (quiet) { return; }
      clearTimeout(timer);
      // Промежуточную подсветку даём сразу — барабан «живой» на глаз,
      // а решение принимаем, когда прокрутка остановилась.
      var i = Math.max(0, Math.min(Math.round(w.scrollTop / STEP), items.length - 1));
      if (i !== idx) { idx = i; light(); if (onpick) { onpick(); } }
      timer = setTimeout(settle, 90);
    }, { passive: true });

    return {
      el: w,
      /* Заполнить барабан. keep — значение, которое стараемся сохранить. */
      /* Список правим на месте, а не пересобираем.
         Прокрутка месяца зовёт refill() на каждом делении, и полная
         пересборка (innerHTML = '' плюс новый scrollTop) дёргала
         барабан дня: на глаз он прыгал, пока соседние стояли смирно.
         Теперь лишние деления снимаются с хвоста, недостающие
         дописываются, а позиция трогается только если она правда
         изменилась. */
      fill: function (values, keep) {
        var self = this;
        while (items.length > values.length) { ul.removeChild(items.pop()); }
        for (var i = 0; i < values.length; i++) {
          var li = items[i];
          if (!li) { li = el('li'); ul.appendChild(li); items.push(li); }
          if (li.textContent !== values[i].text) { li.textContent = values[i].text; }
          li.dataset.v = values[i].value;
          // По делению можно и просто ткнуть — короче, чем крутить.
          li.onclick = (function (v) {
            return function () { self.set(v); if (onpick) { onpick(); } };
          })(values[i].value);
        }
        var at = values.findIndex(function (v) { return String(v.value) === String(keep); });
        var next = at < 0 ? 0 : at;
        var move = next !== idx || Math.abs(w.scrollTop - next * STEP) > 1;
        idx = next;
        if (move) {
          quiet = true;
          w.scrollTop = idx * STEP;
          setTimeout(function () { quiet = false; }, 0);
        }
        light();
      },
      get: function () {
        return items.length ? Number(items[idx].dataset.v) : null;
      },
      set: function (v) {
        for (var i = 0; i < items.length; i++) {
          if (String(items[i].dataset.v) === String(v)) {
            idx = i; quiet = true; w.scrollTop = i * STEP; light();
            setTimeout(function () { quiet = false; }, 0);
            return;
          }
        }
      }
    };
  }

  var wheels = document.getElementById('wheels');
  var fixBtn = document.getElementById('fix');
  var fixed = null;              // подтверждённая дата, ГГГГ-ММ-ДД
  var wDay, wMon, wYear;

  function daysIn(y, m) { return new Date(y, m, 0).getDate(); }

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function shown() {
    var y = wYear.get(), m = wMon.get(), d = wDay.get();
    if (!y || !m || !d) { return null; }
    return y + '-' + pad(m) + '-' + pad(d);

  /* Число дней зависит от месяца и года: в феврале барабан короче. */
  function refill() {
    var y = wYear.get(), m = wMon.get(), keep = wDay.get();
    var n = daysIn(y, m);
    var list = [];
    for (var i = 1; i <= n; i++) { list.push({ value: i, text: String(i) }); }
    wDay.fill(list, Math.min(keep || 1, n));

  /* Кнопка подтверждения намеренно всегда живая. Раньше она гасла, когда

  function relight() {

          Object.keys(правка['движения']).join(', ') +
          ' за ' + ддмм(правка['дата']);
    }
    // Кнопки записи зависят от подтверждения — обновляем вместе,
    // иначе «Записать» остаётся активной на неподтверждённой дате.
    eachCard(check);
    // Барабан крутанули — кнопка снова просит подтверждения. Дата
    // совпала с подтверждённой (вернулись обратно) — гасим её сами.
    fixBtn.classList.toggle('done', same);
    fixBtn.textContent = same ? 'дата установлена' : 'установить дату';
  }

  /* --- таймер отдыха между подходами ---

     Считаем не тиками, а от момента окончания: `конец = сейчас + N`,
     а на экране каждый кадр показываем остаток. Это принципиально.
     Складывать интервалы нельзя: браузер тормозит таймеры в фоне и
     совсем замирает, когда экран гаснет, — сложенные тики отстали бы
     на минуты. От абсолютного момента же отсчёт верен всегда: телефон
     проснулся, кадр посчитался, цифра правильная.

     Экран, чтобы не гас, держим Wake Lock — иначе на трёх минутах
     Android уснёт и писк прозвучит только после разблокировки. */
  var tPanel = document.getElementById('timer');
  var tBtn = document.getElementById('tbtn');
  var tFace = document.getElementById('tface');
  var конец = 0;          // когда истекает, мс epoch; 0 — таймер стоит
  var кадрId = null;
  var будильник = null;   // страховка на случай, если кадры замрут
  var замок = null;       // Wake Lock, держит экран включённым
  var звукCtx = null;

  function дв(n) { return (n < 10 ? '0' : '') + n; }

  /* Минуты:секунды:сотые — шесть цифр, как на секундомере. */
  function табло(мс) {
    if (мс < 0) { мс = 0; }
    var сотых = Math.round(мс / 10);
    tFace.textContent = дв(Math.floor(сотых / 6000)) + ':' +
                        дв(Math.floor(сотых / 100) % 60) + ':' +
                        дв(сотых % 100);
  }

  /* Контекст звука создаётся только по нажатию: без жеста человека
     браузер держит его «на паузе» и писк не прозвучит. */
  function аудио() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { return null; }
    if (!звукCtx) { звукCtx = new AC(); }
    if (звукCtx.state === 'suspended') { звукCtx.resume(); }
    return звукCtx;
  }

  function пикнуть() {
    var ctx = аудио();
    if (!ctx) { return; }
    // Четыре коротких сигнала и тишина: таймер не должен пищать, пока
    // его не выключат — Михаил в этот момент под штангой, а не у телефона.
    for (var i = 0; i < 4; i++) {
      try {
        var o = ctx.createOscillator(), g = ctx.createGain();
        var t = ctx.currentTime + i * 0.22;
        o.type = 'square';
        o.frequency.value = 880;
        // Нарастание и спад по экспоненте — иначе на включении и
        // выключении слышен щелчок громче самого сигнала.
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.3, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t + 0.15);
      } catch (e) { return; }    // звук не вышел — остаётся вибрация
    }
  }

  function дрожь() {
    try {
      if (navigator.vibrate) { navigator.vibrate([130, 90, 130, 90, 240]); }
    } catch (e) { /* на десктопе вибрации нет — и ладно */ }
  }

  function держатьЭкран() {
    if (!navigator.wakeLock || замок) { return; }
    navigator.wakeLock.request('screen').then(function (l) {
      замок = l;
      // Система может забрать замок сама — например, когда экран
      // погасили кнопкой. Тогда просто забываем про него.
      l.addEventListener('release', function () { замок = null; });
    }).catch(function () { замок = null; });
  }

  function отпуститьЭкран() {
    if (!замок) { return; }
    try { замок.release(); } catch (e) { /* уже отдан */ }
    замок = null;
  }

  function кадр() {
    var осталось = конец - Date.now();
    табло(осталось);
    if (осталось <= 0) { дозвон(); return; }
    кадрId = requestAnimationFrame(кадр);
  }

  function стопКадры() {
    if (кадрId) { cancelAnimationFrame(кадрId); кадрId = null; }
    if (будильник) { clearTimeout(будильник); будильник = null; }
  }

  /* Время вышло: пискнуть, дрогнуть, обнулиться. */
  function дозвон() {
    стопКадры();
    конец = 0;
    табло(0);
    tFace.classList.remove('идёт');
    tBtn.classList.remove('идёт');
    tFace.classList.add('вышло');
    setTimeout(function () { tFace.classList.remove('вышло'); }, 2500);
    пикнуть();
    дрожь();
    отпуститьЭкран();
  }

  function пуск(сек) {
    аудио();              // разблокировать звук этим же нажатием
    держатьЭкран();
    стопКадры();
    конец = Date.now() + сек * 1000;
    tFace.classList.remove('вышло');
    tFace.classList.add('идёт');
    tBtn.classList.add('идёт');
    кадрId = requestAnimationFrame(кадр);
    /* Кадры не идут, пока экран погашен. Отдельный таймер на точное
       время добудится сам — с запасом 40 мс, чтобы не сработать
       раньше кадра и не пискнуть дважды. */
    будильник = setTimeout(function () {
      if (конец && Date.now() >= конец) { дозвон(); }
    }, сек * 1000 + 40);
  }

  function сбросТаймера() {
    стопКадры();
    конец = 0;
    табло(0);
    tFace.classList.remove('идёт', 'вышло');
    tBtn.classList.remove('идёт');
    отпуститьЭкран();
  }

  tBtn.onclick = function () {
    var открыт = tPanel.classList.toggle('on');
    tBtn.classList.toggle('on', открыт);
    tBtn.setAttribute('aria-expanded', открыт ? 'true' : 'false');
    // Панель свернули — отсчёт продолжается: её закрывают, чтобы
    // видеть карточки, а не чтобы бросить отдых.
  };

  /* Клавиатура не должна сворачиваться от тапа по таймеру.

     Раньше выходило так: вбил «9», нажал enter, тянешься к «3 мин» —
     и первый тап только УБИРАЕТ клавиатуру, потому что браузер снимает
     фокус с поля. Приходилось жать дважды, стоя над турником.

     preventDefault на pointerdown отменяет именно смену фокуса, а сам
     клик оставляет: поле остаётся активным, клавиатура на месте,
     таймер стартует с первого касания. */
  function держатьФокус(узел) {
    узел.addEventListener('pointerdown', function (e) { e.preventDefault(); });
  }

  держатьФокус(tPanel);
  держатьФокус(tBtn);
  держатьФокус(tFace);

  tPanel.querySelector('.tacts').onclick = function (e) {
    var b = e.target.closest('button');
    if (!b) { return; }
    if (b.id === 'townbtn') { свойИнтервал(); return; }
    пуск(Number(b.dataset.sec));
  };

  /* --- свой интервал ---
     Кнопками, а не полем ввода: между подходами руки дрожат, телефон
     лежит на полу, и цифровая клавиатура тут проигрывает крупным
     кнопкам вчистую. Заодно не воюем с фокусом.

     Выбранное живёт до перезагрузки: те же три с половиной минуты
     обычно нужны и на следующем подходе. */
  var свои = 150;
  var setBox = document.getElementById('tset');
  var ownBtn = document.getElementById('townbtn');

  function мсс(сек) {
    return Math.floor(сек / 60) + ':' + ('0' + (сек % 60)).slice(-2);
  }

  function показатьСвои() {
    document.getElementById('tmin').textContent = Math.floor(свои / 60);
    document.getElementById('tsec').textContent = ('0' + (свои % 60)).slice(-2);
    document.getElementById('tsetgo').textContent = 'Запустить ' + мсс(свои);
  }

  function свойИнтервал() {
    var открыт = setBox.hidden;
    setBox.hidden = !открыт;
    ownBtn.classList.toggle('on', открыт);
    ownBtn.setAttribute('aria-expanded', открыт ? 'true' : 'false');
    tPanel.classList.toggle('свой', открыт);
    if (открыт) { показатьСвои(); }
  }

  setBox.onclick = function (e) {
    var b = e.target.closest('button');
    if (!b) { return; }
    if (b.id === 'tsetgo') {
      свойИнтервал();          // свернуть настройку
      пуск(свои);
      return;
    }
    // Ниже пяти секунд отсчёт бессмыслен, выше часа — опечатка.
    свои = Math.max(5, Math.min(3600, свои + Number(b.dataset.step)));
    показатьСвои();
  };
  показатьСвои();

  // Тап по табло — сброс. Единственный способ остановить отсчёт,
  // если нажал не ту кнопку.
  tFace.onclick = function () {
    if (!конец) { return; }
    сбросТаймера();
    stat('таймер сброшен');
  };

  /* Вернулись к приложению. Кадры всё это время стояли, поэтому цифра
     на табло устарела — считаем от момента окончания заново. */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden || !конец) { return; }
    if (Date.now() >= конец) { дозвон(); return; }
    держатьЭкран();       // замок мог забрать сам браузер
    стопКадры();
    кадрId = requestAnimationFrame(кадр);
  });

  function buildPicker(today) {
    // Барабаны встают на сегодня, а не на дату прошлой записи. Иначе
    // назавтра после тренировки открываешь дневник и видишь вчерашнее
    // число — а тренировку пишешь за сегодня.
    var start = today;
    var y0 = Number(start.slice(0, 4)), m0 = Number(start.slice(5, 7)),
        d0 = Number(start.slice(8, 10));

    wDay = wheel('day', relight);
    wMon = wheel('mon', function () { refill(); relight(); });
    wYear = wheel('year', function () { refill(); relight(); });
    wheels.appendChild(wDay.el);
    wheels.appendChild(wMon.el);
    wheels.appendChild(wYear.el);

    var years = [];
    // Снизу — первый год дневника, сверху — следующий: занятие «на завтра»
    // не заносят, но переход года не должен упираться в потолок.
    // Текст — ’26 вместо 2026: двадцать первый век в дневнике тренировок
    // уточнять незачем, а освободившиеся 20 px ушли кнопке таймера.
    for (var y = 2022; y <= Number(today.slice(0, 4)) + 1; y++) {
      years.push({ value: y, text: '’' + String(y).slice(2) });
    }
    wYear.fill(years, y0);
    wMon.fill(MONTHS.map(function (t, i) {
      return { value: i + 1, text: t };
    }), m0);
    refill();
    wDay.set(d0);
    relight();
  }

  fixBtn.onclick = function () {
    var now = shown();
    if (!now) { return; }
    fixed = now;
    try { localStorage.setItem(KEY, fixed); } catch (e) { /* приватный режим */ }
    fixBtn.classList.add('done');
    fixBtn.textContent = 'дата установлена';
    eachCard(check);
  };

  /* Поле под один подход. Enter и заполнение двух цифр уводят фокус
     дальше, чтобы не тянуться пальцем к следующей клетке. */
  function field(card) {
    var i = el('input');
    i.type = 'text';
    i.inputMode = 'numeric';
    i.pattern = '[0-9]*';
    i.maxLength = 3;
    i.setAttribute('aria-label', 'повторений в подходе');
    i.addEventListener('input', function () {
      i.value = i.value.replace(/\D/g, '');
      подогнать(card);
      check(card);
    });
    i.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); next(i); }
    });
    return i;
  }

  /* Пустое место под следующий подход. Ни кнопка, ни поле: нажимать
     её не надо, она только показывает, что ряд продолжится. */
  function фантом() {
    var g = el('div', 'ghost');
    g.setAttribute('aria-hidden', 'true');
    return g;
  }

  /* Ряд полей = заполненные плюс одно пустое. Ни кнопки «+», ни трёх
     клеток авансом: вбил число — место под следующее появилось само.

     Поле, в котором стоит курсор, не удаляем никогда, даже если оно
     лишнее по счёту: иначе клавиатура схлопнется посреди ввода. */
  function подогнать(card) {
    var sets = card.querySelector('.sets');
    var g = sets.querySelector('.ghost');
    var поля = [].slice.call(sets.querySelectorAll('input'));

    var последнее = -1;
    поля.forEach(function (i, n) { if (i.value.trim()) { последнее = n; } });
    var нужно = Math.max(1, Math.min(последнее + 2, MAX_SETS));

    while (поля.length < нужно) {
      var f = field(card);
      sets.insertBefore(f, g || null);
      поля.push(f);
    }
    while (поля.length > нужно) {
      var хвост = поля[поля.length - 1];
      if (хвост === document.activeElement) { break; }
      хвост.remove();
      поля.pop();
    }
    if (g) { g.hidden = поля.length >= MAX_SETS; }
  }

  /* Enter уводит в следующее поле — и НЕ снимает фокус, если поле
     последнее. Раньше здесь стоял blur(), и клавиатура закрывалась
     ровно в тот момент, когда собирался вводить дальше. */
  function next(input) {
    var all = [].slice.call(input.parentNode.querySelectorAll('input'));
    var i = all.indexOf(input);
    if (all[i + 1]) { all[i + 1].focus(); }
  }

  function values(card) {
    return [].slice.call(card.querySelectorAll('.sets input'))
      .map(function (i) { return parseInt(i.value, 10); })
      .filter(function (v) { return v > 0; });
  }

  // Кнопка живая только когда есть что отправлять — и когда понятно,
  // за какой день. Барабаны крутанули, а галочку не нажали — запись
  // ушла бы в прошлую дату молча; это как раз тот случай, который
  // замечаешь через месяц и уже не починишь.
  function check(card) {
    var v = values(card);
    var stale = shown() !== fixed;
    var ser = card.querySelector('.go.ser');
    var go = card.querySelector('.go:not(.ser)');

    // Набранное показываем в заголовке: «подтягивания : 9 + 3».
    // Кнопкам подпись менять нельзя — их три и они узкие.
    card.querySelector('.tally').textContent = v.join(' + ');

    // Мио-серия из одного числа — это обычный подход. Сервер такое
    // отвергает, и кнопка не должна обещать обратное.
    ser.disabled = !v.length || stale || v.length < 2;
    go.disabled = !v.length || stale;

    var чиню = !!(правка && правка['движения'][card.dataset.move]);
    go.textContent = stale ? 'подтвердите дату'
      : (чиню ? 'сохранить правку' : 'записать тренировку');
  }

  function card(move) {
    var c = el('section', 'move');
    c.dataset.move = move;

    var top = el('div', 'top');
    top.appendChild(el('h2', null, move + ' :'));
    top.appendChild(el('span', 'tally'));
    c.appendChild(top);

    /* Одно поле под первый подход и пустое место под следующий.
       Три клетки авансом выглядели как требование заполнить их все. */
    var sets = el('div', 'sets');
    sets.appendChild(field(c));
    sets.appendChild(фантом());
    c.appendChild(sets);

    var act = el('div', 'act');

    /* Комментарий. Кнопка не пишет ничего сама — она открывает поле
       с тем, что уже записано за этот день, чтобы дописать, а не
       начать заново. */
    var noteBtn = el('button', 'note-btn', 'комментарий');
    noteBtn.type = 'button';
    noteBtn.onclick = function () { toggleNote(c); };
    act.appendChild(noteBtn);

    /* Две кнопки записи. Данные обе кладут одинаково — серией рядом
       с уже записанным за день. Разница в пометке и в том, что
       «серия» оставляет карточку готовой к следующему заходу. */
    var ser = el('button', 'go ser', 'записать серию');
    ser.type = 'button';
    ser.disabled = true;
    ser.onclick = function () { send(c, MYO); };
    act.appendChild(ser);

    var go = el('button', 'go', 'записать тренировку');
    go.type = 'button';
    go.disabled = true;
    go.onclick = function () { send(c, NORMAL); };
    act.appendChild(go);

    c.appendChild(act);
    return c;
  }

  /* --- комментарий ------------------------------------------------------
     Поле разворачивается под кнопками и закрывается повторным нажатием.
     Текст берётся из последней записи дня: человек дописывает к тому,
     что уже есть, — так он сам просил. */
  function toggleNote(c) {
    var open = c.querySelector('.note');
    if (open) { open.remove(); return; }

    var wrap = el('div', 'note');
    var area = el('textarea');
    area.value = noteOf(c.dataset.move, fixed) || '';
    area.placeholder = 'что запомнилось';
    wrap.appendChild(area);

    var ok = el('button', null, 'ок');
    ok.type = 'button';
    ok.onclick = function () { saveNote(c, area.value); };
    wrap.appendChild(ok);

    c.appendChild(wrap);
    area.focus();
    // Курсор в конец: дописывают чаще, чем переписывают.
    area.setSelectionRange(area.value.length, area.value.length);
  }

  function noteOf(move, when) {
    var день = (дни || []).filter(function (d) { return d['дата'] === when; })[0];
    return день && день['движения'][move] ? день['движения'][move]['комментарий'] : '';
  }

  function saveNote(c, text) {
    var move = c.dataset.move;
    fetch('/api/note', {
      method: 'POST',
      headers: auth({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ 'упражнение': move, 'дата': fixed,
                             'комментарий': text })
    }).then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok) { throw new Error(d['ошибка'] || 'сервер отказал'); }
        return d;
      });
    }).then(function () {
      var open = c.querySelector('.note');
      if (open) { open.remove(); }
      stat('сохранено');
      return refresh();
    }).catch(function (e) {
      /* Отдельной подсказки про «сначала запиши подходы» больше нет:
         сервер заводит занятие сам, если комментарий пришёл раньше
         первой серии. Заметку по ходу тренировки пишут именно так. */
      say(e.message, 'bad');
    });
  }

  var дни = [];              // последние 15 тренировок, как в книге

  function paint(data) {
    дни = data['дни'] || [];
    MOVES.forEach(function (move) {
      var c = cardOf(move);
      if (!c) { return; }
      var день = дни.filter(function (d) { return d['дата'] === fixed; })[0];
      var мой = день && день['движения'][move];
      // Кнопка комментария подсвечена, если за этот день уже есть текст.
      c.querySelector('.note-btn').classList.toggle('has',
        !!(мой && мой['комментарий']));
    });
    рисоватьТаблицу();
  }

  function рекорды(data) {
    var bodyEl = document.getElementById('recsbody');
    bodyEl.innerHTML = '';
    MOVES.forEach(function (move) {
      var d = data['движения'][move] || {};
      var r = d['рекорд'] || {}, y = d['загод'] || {};
      var p = el('div', 'rec');
      // Год — то, что реально можно побить сегодня. Всё время — память.
      p.innerHTML = '<b>' + move + '</b><br>' +
        'за год: подход <b>' + (y['подход'] || 0) +
        '</b>, занятие <b>' + (y['занятие'] || 0) + '</b><br>' +
        '<span class="dim">всего занятий ' + (d['занятий'] || 0) +
        ' · пик за всё время ' + (r['подход'] || 0) +
        '/' + (r['занятие'] || 0) + '</span>';
      bodyEl.appendChild(p);
    });
  }

  /* kind — какой кнопкой записали. «Серия» помечает занятие как мио и
     оставляет карточку готовой к следующему заходу; «тренировка»
     просто закрывает запись. Данные обе кладут одинаково: серией рядом
     с тем, что за день уже есть.

     Исключение — правка: там день заменяется целиком, иначе
     исправленная запись легла бы третьей серией рядом с ошибочными. */
  function send(c, kind) {
    var move = c.dataset.move;
    var v = values(c);
    if (!v.length) { return; }
    var was = state[move] || { 'подход': 0, 'занятие': 0 };   // рекорд года ДО записи
    var чиню = !!(правка && правка['движения'][move]);
    var btn = c.querySelector(kind === MYO ? '.go.ser' : '.go:not(.ser)');

    /* Правим мио-тренировку — уходят все её серии сразу, а не только
       открытая в полях. Иначе сохранение правки первой серии стёрло бы
       вторую: сервер при правке заменяет запись дня целиком. */
    var серии = чиню ? серииКарточки(c) : null;
    if (серии) {
      v = серии;
      kind = MYO;
    }
    [].forEach.call(c.querySelectorAll('.go'), function (b) { b.disabled = true; });
    stat('сохранение…');

    fetch('/api/add', {
      method: 'POST',
      headers: auth({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({
        'упражнение': move, 'подходы': v, 'дата': fixed,
        'формат': kind || NORMAL, 'дописать': !чиню
      })
    }).then(function (r) {
      return r.json().then(function (d) {
        if (!r.ok) { throw new Error(d['ошибка'] || 'сервер отказал'); }
        return d;
      });
    }).then(function (d) {
      remember(d);
      paint(d);
      // Рекорды живут в меню и обновляются здесь же: открывать его
      // после каждой записи ради пересчёта никто не станет.
      рекорды(d);
      // Зелёные ячейки Михаил раньше красил руками. Рекорд считается сам.
      var now = d['движения'][move]['загод'];
      var beat = now['подход'] > was['подход'] || now['занятие'] > was['занятие'];
      stat('сохранено');
      // Всплывашку бережём для рекорда: если она выскакивает на каждую
      // запись, на рекорд перестаёшь обращать внимание.
      // v может быть списком серий — тогда склеиваем их через слеш,
      // как в таблице и в книге.
      if (beat) {
        var подпись = (серии ? серии : [v]).map(function (s) {
          return s.join(' + ');
        }).join(' ' + SEP + ' ');
        say('Рекорд! ' + move + ' — ' + подпись, 'win');
      }
      // Правку закрываем сами: иначе жёлтая полоса висит над формой,
      // и следующая тренировка пишется «в режиме правки».
      if (чиню) {
        say(move + ' за ' + ддмм(fixed) + ' обновлено');
        delete правка['движения'][move];
        c.classList.remove('правится');
        c.classList.add('чужая');
        забытьСерии(c);
        сбросить(c);
        // Поправили всё, что было в этом дне — полоса уходит сама.
        if (!Object.keys(правка['движения']).length) { бросить(); return; }
        relight();   // в полосе остаются только неисправленные движения
        return;
      }
      сбросить(c);
      // Подтверждение на месте самой кнопки: всплывашку внизу экрана
      // между подходами не замечаешь, а сюда палец уже смотрит.
      if (kind === MYO) { мигнуть(btn, 'серия записана'); }
      check(c);
    }).catch(function (e) {
      stat(String(e.message || e), true);
      check(c);
    });
  }

  /* После записи остаётся одно пустое поле — ровно как при открытии.
     Следующая серия начинается с того же места, что и первая. */
  function сбросить(c) {
    var sets = c.querySelector('.sets');
    [].forEach.call(sets.querySelectorAll('input'), function (i) { i.remove(); });
    sets.insertBefore(field(c), sets.querySelector('.ghost') || null);
    подогнать(c);
    c.querySelector('.tally').textContent = '';
  }

  function мигнуть(btn, text) {
    var было = btn.textContent;
    btn.textContent = text;
    btn.classList.add('ok');
    setTimeout(function () {
      btn.textContent = было;
      btn.classList.remove('ok');
    }, OK_MS);
  }

  var state = {};
  function remember(d) {
    MOVES.forEach(function (m) { state[m] = d['движения'][m]['загод']; });
  }

  MOVES.forEach(function (m) { box.appendChild(card(m)); });

  /* --- таблица последних тренировок -------------------------------------
     Тот же вид, что в книге: строка — день, по каждому движению подходы
     и сумма, справа комментарий. Она же список для правки — тап по
     строке поднимает запись в форму. Отдельного списка в меню больше
     нет, эта таблица его заменила. */
  var logTable = document.getElementById('logtable');

  function рисоватьТаблицу() {
    logTable.innerHTML = '';

    var head = el('thead');
    var r1 = el('tr');
    var th = el('th', 'd', 'дата');
    th.rowSpan = 2;
    r1.appendChild(th);
    MOVES.forEach(function (m) {
      var c = el('th', null, m);
      c.colSpan = 2;
      r1.appendChild(c);
    });
    var note = el('th', null, 'комментарий');
    note.rowSpan = 2;
    r1.appendChild(note);
    head.appendChild(r1);

    var r2 = el('tr');
    MOVES.forEach(function () {
      r2.appendChild(el('th', null, 'подходы'));
      r2.appendChild(el('th', null, 'всего'));
    });
    head.appendChild(r2);
    logTable.appendChild(head);

    var body = el('tbody');
    // Свежие сверху: внизу страницы взгляд падает на первую строку.
    дни.slice().reverse().forEach(function (d) {
      var tr = el('tr');
      tr.appendChild(el('td', 'd', ддммгг(d['дата'])));
      MOVES.forEach(function (m) {
        var got = d['движения'][m];
        tr.appendChild(el('td', null, got
          ? got['серии'].map(function (s) { return s.join(' + '); })
              .join(' ' + SEP + ' ')
          : ''));
        tr.appendChild(el('td', 'sum', got ? String(got['сумма']) : ''));
      });
      tr.appendChild(el('td', 'cmt', d['комментарий'] || ''));
      tr.onclick = function () { изДня(d); };
      body.appendChild(tr);
    });
    logTable.appendChild(body);
  }

  function ддммгг(iso) {
    var p = iso.split('-');
    return p[2] + '.' + p[1] + '.' + p[0];
  }

  /* Тап по строке открывает на правку ВЕСЬ день. В строке до трёх
     движений, и, метясь в отжимания, человек попадал бы в подтягивания:
     раньше поднималось только первое записанное. Теперь заполняются все
     карточки этого дня — править можно любую, кнопка записи у каждой
     своя. */
  function изДня(d) {
    var день = { 'дата': d['дата'], 'движения': {} };
    MOVES.forEach(function (m) {
      var got = d['движения'][m];
      if (!got) { return; }
      /* Серии передаём как есть, не сливая в один ряд. Слитые они
         теряли границы заходов: сохранение правки записывало всё
         одной серией, и мио-тренировка переставала быть мио. */
      день['движения'][m] = got['серии'].map(function (s) { return s.slice(); });
    });
    править(день);
  }

  // Помним последнюю подтверждённую дату, чтобы после перезагрузки
  // страницы посреди тренировки не подтверждать её заново.
  try { fixed = localStorage.getItem(KEY) || null; } catch (e) { fixed = null; }

  stat('загрузка…');
  fetch('/api/state', { headers: auth() }).then(function (r) { return r.json(); })
    .then(function (d) {
      // Чистое устройство: сегодня считаем подтверждённым сразу, иначе на
      // пустом дневнике «Записать» заблокирована с порога без причины.
      if (!fixed) { fixed = d['сегодня']; }
      buildPicker(d['сегодня']);
      remember(d);
      paint(d);
      рекорды(d);
      eachCard(check);
      stat('сохранено');
    })
    .catch(function () { stat('нет связи', true); });
}());

/* Без service worker Chrome предлагает только «ярлык на сайт», а не
   установку приложения. Регистрируем после загрузки, чтобы он не
   соперничал за сеть с первым запросом данных. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js').catch(function (e) {
      console.log('service worker не встал:', e);
    });
  });
}
</script>
</body>
</html>
